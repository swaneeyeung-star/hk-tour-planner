name: sync-index

on:
  push:
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull live index.html
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL -o index.html https://sites.hellominds.ai/scubavo.tuff/hk-tour-planner/index.html; then
              ok=1
              break
            fi
            echo "retry $i failed; sleeping"
            sleep 20
          done
          test "$ok" = "1"
          SZ=$(wc -c < index.html)
          echo "index.html bytes: $SZ"
          test "$SZ" -gt 500000

      - name: Commit if changed
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged - nothing to commit"
          else
            git commit -m "sync: live index.html (auto from canonical site URL)"
            git push
          fi
